              - list [ref=f44e117]:
                - listitem [ref=f44e118]:
                  - paragraph [ref=f44e119]: Experience with monorepo setups (Turborepo, Nx) or distributed micro-frontend architectures.
                - listitem [ref=f44e120]:
                  - paragraph [ref=f44e121]: Exposure to modern CSS paradigms (Tailwind CSS, CSS Modules) and managing enterprise-grade design systems.
                - listitem [ref=f44e122]:
                  - paragraph [ref=f44e123]: Background in backend integration, web sockets, or serverless functions (Node.js).
                - listitem [ref=f44e124]:
                  - paragraph [ref=f44e125]: Familiarity with continuous integration and continuous deployment pipelines (CI/CD) for single-page applications.
              - paragraph [ref=f44e126]
              - heading [level=3] [ref=f44e127]:
