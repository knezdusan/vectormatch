                    - text: 5+ years of professional engineering experience, with 3+ years focused deeply on building scale-ready applications with
                    - strong [ref=f44e97]: React.js
                    - text: and
                    - strong [ref=f44e98]: TypeScript
                    - text: .
                - listitem [ref=f44e99]:
                  - paragraph [ref=f44e100]:
                    - text: Expert-level understanding of state management ecosystems, knowing exactly when to utilize global tools (
                    - strong [ref=f44e101]: Redux Toolkit, Zustand
                    - text: ) versus server-cache managers (
                    - strong [ref=f44e102]: React Query/ZandStack Query
                    - text: ) and native Context.
                - listitem [ref=f44e103]:
                  - paragraph [ref=f44e104]:
                    - text: Deep familiarity with modern React frameworks, specifically
                    - strong [ref=f44e105]: Next.js
                    - text: ", including a strong functional understanding of Server-Side Rendering (SSR), Static Site Generation (SSG), and React Server Components (RSC)."
                - listitem [ref=f44e106]:
                  - paragraph [ref=f44e107]: Proven track record of identifying and fixing web performance bottlenecks—handling layout shifts (CLS), minimizing bundle sizes via code-splitting, optimizing re-renders, and mastering Core Web Vitals.
                - listitem [ref=f44e108]:
                  - paragraph [ref=f44e109]:
                    - text: A strong commitment to automated testing, utilizing tools like
                    - strong [ref=f44e110]: Jest, React Testing Library, and Cypress/Playwright
                    - text: to maintain high regression confidence.
                - listitem [ref=f44e111]:
                  - paragraph [ref=f44e112]:
                    - text: Exceptional eye for UI polish and layout implementation, with a solid commitment to semantic HTML and web accessibility standards (
                    - strong [ref=f44e113]: WCAG/ARIA
                    - text: ).
              - paragraph [ref=f44e114]
              - heading [level=3] [ref=f44e115]:
