              - paragraph [ref=f44e80]:
                - strong [ref=f44e81]: "About us:"
              - paragraph [ref=f44e82]
              - paragraph [ref=f44e83]: Talent has no borders. Proxify's mission is to connect top developers around the world with opportunities they deserve. So, it doesn't matter where you are; we are here to help you fast-track your independent career in the right direction.
              - paragraph [ref=f44e84]: Since our launch, Proxify's developers have successfully worked with 1200+ happy clients to build their products and growth features. 5000+ talented developers trust Proxify and its network to fulfil their dreams and objectives.
              - paragraph [ref=f44e85]: Proxify is shaped by a global network of supportive, talented developers interested in remote full-time jobs. Our Glassdoor (4.5/5) and Trustpilot (4.8/5) ratings reflect the trust developers place in us and our commitment to our members' success.
              - paragraph [ref=f44e86]
              - heading [level=3] [ref=f44e87]:
                - strong [ref=f44e88]: The Mission
              - paragraph [ref=f44e89]:
                - text: We are looking for a
                - strong [ref=f44e90]: Senior Frontend Developer (React.js)
                - text: on behalf of one of our high-growth client teams to lead the architecture, optimization, and scaling of their user-facing web applications. In this role, you will be responsible for transforming complex product designs into highly interactive, modular, and pixel-perfect digital experiences. You are a perfect candidate if you are growth-oriented, you love what you do, and you enjoy working on new ideas to develop exciting products.
              - paragraph [ref=f44e91]
              - heading [level=3] [ref=f44e92]:
                - strong [ref=f44e93]: What We Are Looking For
              - list [ref=f44e94]:
