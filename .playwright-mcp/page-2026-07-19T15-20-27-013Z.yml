        - heading "The bottom line" [level=2] [ref=f4e142]
        - paragraph [ref=f4e143]: "Workday’s ranking system is not a secret judge that auto-rejects you. It’s a prioritization tool that helps recruiters manage high volumes of applications. The real gatekeeper is knockout questions—and your resume’s visibility depends on how well it matches the job description. Stop worrying about a hidden score and start focusing on what actually matters: tailoring your resume, using clear formatting, and answering those knockout questions correctly."
