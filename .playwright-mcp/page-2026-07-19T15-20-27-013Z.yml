        - heading "Why Workday’s ranking system matters in 2026" [level=2] [ref=f4e70]
        - paragraph [ref=f4e71]:
          - text: Workday is used by the majority of Fortune 500 companies and has rolled out
          - link "AI agents that automatically source, rank, and recommend candidates" [ref=f4e72] [cursor=pointer]:
            - /url: https://www.forbes.com/councils/forbescoachescouncil/2026/03/19/why-your-resume-isnt-making-it-past-the-new-ai-gatekeepers/
          - text: to hiring managers. Understanding how this ranking actually works—not the myths—can mean the difference between being seen and being invisible. Workday’s ranking is not a black-box death sentence; it’s a prioritization tool.
        - heading "What do recruiters actually see when they open Workday?" [level=2] [ref=f4e73]
        - paragraph [ref=f4e74]: Recruiters see candidates organized by pipeline stage—Applied, Screening, Interview, Offer, Hire—not by a single numeric score. The default view is a list of applicants sorted by stage and application date, with the ability to filter and sort by various fields. There is no giant “auto-reject” button powered by a secret score.
        - paragraph [ref=f4e75]:
          - text: "Every ATS gives recruiters two primary views: the candidate view (full history at that company) and the requisition view (all applicants for a specific job). Recruiters typically work in the requisition view, reviewing applicants one by one. They can sort by any column—name, stage, source, or even an AI-generated priority score if the company has enabled it. But the key point:"
          - strong [ref=f4e76]: they can see everyone
          - text: . No one is hidden unless a knockout question was failed.
        - heading "Does Workday use AI to rank candidates?" [level=2] [ref=f4e77]
        - paragraph [ref=f4e78]:
          - text: Yes, but ranking is not rejection. Workday uses
          - link "HiredScore, an AI-powered candidate ranking tool it acquired in 2024" [ref=f4e79] [cursor=pointer]:
            - /url: https://www.forbes.com/councils/forbescoachescouncil/2026/03/19/why-your-resume-isnt-making-it-past-the-new-ai-gatekeepers/
          - text: ", to assign priority scores and recommend top candidates to recruiters. This AI helps recruiters focus on the most relevant applicants first, but it does not automatically reject lower-ranked candidates."
        - paragraph [ref=f4e80]:
          - text: HiredScore analyzes resumes against job descriptions, looking for skills, experience, and other signals. It then assigns a “grade” or priority score that appears in the recruiter’s view. Recruiters can use this to sort candidates, but they can also ignore it and review applicants in any order they choose. As one recruiter put it,
          - link "“My ATS ranks them high-mid-low-unclassified. But I find the rating category it assigns very unreliable”" [ref=f4e81] [cursor=pointer]:
            - /url: https://www.reddit.com/r/recruiting/comments/1bw5pmn/does_your_ats_really_parse_throughfilter_resumes/
          - text: . The AI is a suggestion, not a judge.
        - paragraph [ref=f4e82]: Workday’s Illuminate platform, which includes a Recruiter Agent, claims to boost recruiter capacity by 54%. But even with AI, the final decision to move a candidate forward or reject them rests with a human.
        - 'figure "How Workday’s ranking works: parse → match → prioritize → human review. Ranking orders the queue; it does not reject you." [ref=f4e83]':
