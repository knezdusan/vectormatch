        - heading "What about the “hidden score” myth?" [level=2] [ref=f4e113]
        - paragraph [ref=f4e114]:
          - text: There is no secret algorithm in Workday that assigns a single score and auto-rejects you if it’s too low.
          - link "Real hiring systems like Workday, Lever, and Greenhouse don’t give candidates scores" [ref=f4e115] [cursor=pointer]:
            - /url: https://www.linkedin.com/posts/elvis-levi_youve-spent-hours-perfecting-your-resume-activity-7381184007079890944-8L1H
          - text: —they parse and rank internally. Those 72% or 86% “match ratings” you see online are just keyword counters from third-party tools, not something recruiters ever see.
        - paragraph [ref=f4e116]: The myth persists because of a few reasons. First, vendors market AI-driven ranking, which sounds like a robot judging you. Second, recruiters and candidates misinterpret “ranked lists” as “rejected candidates”. Third, the career-advice industry has profited from fear—selling templates and resume rewrites based on the idea that you must “beat the ATS”.
        - paragraph [ref=f4e117]:
          - text: As one recruiter explained,
          - link "“An ATS is a filing cabinet. That’s it. It doesn’t make decisions”" [ref=f4e118] [cursor=pointer]:
            - /url: https://huntr.co/blog/how-applicant-tracking-systems-work
          - text: . The real problem isn’t a hidden score; it’s that your resume might not be visible because it lacks the keywords recruiters search for, or because you failed a knockout question.
        - heading "What auto-rejects you in Workday—and how to get seen" [level=2] [ref=f4e119]
        - paragraph [ref=f4e120]: The only true auto-reject mechanism in Workday is knockout questions—hard requirements like work authorization, specific certifications, or location constraints. If you answer “no” to a knockout question, your application is automatically disqualified and never reaches a human.
        - paragraph [ref=f4e121]: Knockout questions are configured by the employer and are usually binary (yes/no) or multiple-choice. They are not part of the ranking system; they are a separate filter that sits before any human review. Miss one, and you’re out—no appeal, no second look. This is the real gatekeeper, not a hidden score.
        - paragraph [ref=f4e122]:
          - text: "To get seen, focus on what actually matters:"
          - link "tailoring your resume to the job description" [ref=f4e123] [cursor=pointer]:
            - /url: https://vectormatch.dev
          - text: ", using natural keywords, and answering knockout questions correctly. Workday’s parser extracts text from your resume and matches it against the requisition. If your resume contains the right skills and experience, you’ll surface in recruiter searches."
        - paragraph [ref=f4e124]: "Avoid common pitfalls: complex formatting, tables, headers/footers, and hidden text. Workday’s parser can struggle with these, and if it can’t read your resume cleanly, you might be scored at zero and become invisible. Use a clean, single-column layout with standard section titles. And always, always answer knockout questions truthfully—they are the only thing that can truly auto-reject you."
        - paragraph [ref=f4e125]: Referrals also bypass much of the ranking system. If an employee refers you, your application is often flagged and moved to the top of the recruiter’s queue. Networking isn’t just about getting a job; it’s about skipping the queue entirely.
