        - heading "Why Workday’s ranking system matters in 2026" [level=2] [ref=f3e72]
        - paragraph [ref=f3e73]:
          - text: Workday is used by the majority of Fortune 500 companies and has rolled out
          - link "AI agents that automatically source, rank, and recommend candidates" [ref=f3e74] [cursor=pointer]:
            - /url: https://www.forbes.com/councils/forbescoachescouncil/2026/03/19/why-your-resume-isnt-making-it-past-the-new-ai-gatekeepers/
          - text: to hiring managers. Understanding how this ranking actually works—not the myths—can mean the difference between being seen and being invisible. Workday’s ranking is not a black-box death sentence; it’s a prioritization tool.
        - heading "What do recruiters actually see when they open Workday?" [level=2] [ref=f3e75]
        - paragraph [ref=f3e76]: Recruiters see candidates organized by pipeline stage—Applied, Screening, Interview, Offer, Hire—not by a single numeric score. The default view is a list of applicants sorted by stage and application date, with the ability to filter and sort by various fields. There is no giant “auto-reject” button powered by a secret score.
        - paragraph [ref=f3e77]:
          - text: "Every ATS gives recruiters two primary views: the candidate view (full history at that company) and the requisition view (all applicants for a specific job). Recruiters typically work in the requisition view, reviewing applicants one by one. They can sort by any column—name, stage, source, or even an AI-generated priority score if the company has enabled it. But the key point:"
          - strong [ref=f3e78]: they can see everyone
          - text: . No one is hidden unless a knockout question was failed.
        - 'figure "The requisition view: recruiters can sort by any column, including AI priority. Photo: Jakub Żerdzicki on Unsplash" [ref=f3e79]':
          - img "Workday requisition view showing candidate list and sorting options" [ref=f3e80]
        - heading "Does Workday use AI to rank candidates?" [level=2] [ref=f3e82]
        - paragraph [ref=f3e83]:
          - text: Yes, but ranking is not rejection. Workday uses
          - link "HiredScore, an AI-powered candidate ranking tool it acquired in 2024" [ref=f3e84] [cursor=pointer]:
            - /url: https://www.forbes.com/councils/forbescoachescouncil/2026/03/19/why-your-resume-isnt-making-it-past-the-new-ai-gatekeepers/
          - text: ", to assign priority scores and recommend top candidates to recruiters. This AI helps recruiters focus on the most relevant applicants first, but it does not automatically reject lower-ranked candidates."
        - paragraph [ref=f3e85]:
          - text: HiredScore analyzes resumes against job descriptions, looking for skills, experience, and other signals. It then assigns a “grade” or priority score that appears in the recruiter’s view. Recruiters can use this to sort candidates, but they can also ignore it and review applicants in any order they choose. As one recruiter put it,
          - link "“My ATS ranks them high-mid-low-unclassified. But I find the rating category it assigns very unreliable”" [ref=f3e86] [cursor=pointer]:
            - /url: https://www.reddit.com/r/recruiting/comments/1bw5pmn/does_your_ats_really_parse_throughfilter_resumes/
          - text: . The AI is a suggestion, not a judge.
        - paragraph [ref=f3e87]: Workday’s Illuminate platform, which includes a Recruiter Agent, claims to boost recruiter capacity by 54%. But even with AI, the final decision to move a candidate forward or reject them rests with a human.
        - 'figure "How Workday’s ranking works: parse → match → prioritize → human review. Photo: maks_d on Unsplash" [ref=f3e88]':
          - img "Flowchart showing how Workday ranks candidates using HiredScore AI" [ref=f3e89]
        - heading "What about the “hidden score” myth?" [level=2] [ref=f3e91]
        - paragraph [ref=f3e92]:
          - text: There is no secret algorithm in Workday that assigns a single score and auto-rejects you if it’s too low.
          - link "Real hiring systems like Workday, Lever, and Greenhouse don’t give candidates scores" [ref=f3e93] [cursor=pointer]:
            - /url: https://www.linkedin.com/posts/elvis-levi_youve-spent-hours-perfecting-your-resume-activity-7381184007079890944-8L1H
          - text: —they parse and rank internally. Those 72% or 86% “match ratings” you see online are just keyword counters from third-party tools, not something recruiters ever see.
        - paragraph [ref=f3e94]: The myth persists because of a few reasons. First, vendors market AI-driven ranking, which sounds like a robot judging you. Second, recruiters and candidates misinterpret “ranked lists” as “rejected candidates”. Third, the career-advice industry has profited from fear—selling templates and resume rewrites based on the idea that you must “beat the ATS”.
        - paragraph [ref=f3e95]:
          - text: As one recruiter explained,
          - link "“An ATS is a filing cabinet. That’s it. It doesn’t make decisions”" [ref=f3e96] [cursor=pointer]:
            - /url: https://huntr.co/blog/how-applicant-tracking-systems-work
          - text: . The real problem isn’t a hidden score; it’s that your resume might not be visible because it lacks the keywords recruiters search for, or because you failed a knockout question.
        - heading "What auto-rejects you in Workday—and how to get seen" [level=2] [ref=f3e97]
        - paragraph [ref=f3e98]: The only true auto-reject mechanism in Workday is knockout questions—hard requirements like work authorization, specific certifications, or location constraints. If you answer “no” to a knockout question, your application is automatically disqualified and never reaches a human.
        - paragraph [ref=f3e99]: Knockout questions are configured by the employer and are usually binary (yes/no) or multiple-choice. They are not part of the ranking system; they are a separate filter that sits before any human review. Miss one, and you’re out—no appeal, no second look. This is the real gatekeeper, not a hidden score.
        - 'figure "Knockout questions are the only true auto-reject mechanism in Workday. Photo: Artem Sapegin on Unsplash" [ref=f3e100]':
          - img "Workday application form with knockout questions highlighted" [ref=f3e101]
        - paragraph [ref=f3e103]:
          - text: "To get seen, focus on what actually matters:"
          - link "tailoring your resume to the job description" [ref=f3e104] [cursor=pointer]:
            - /url: https://vectormatch.dev
          - text: ", using natural keywords, and answering knockout questions correctly. Workday’s parser extracts text from your resume and matches it against the requisition. If your resume contains the right skills and experience, you’ll surface in recruiter searches."
        - paragraph [ref=f3e105]: "Avoid common pitfalls: complex formatting, tables, headers/footers, and hidden text. Workday’s parser can struggle with these, and if it can’t read your resume cleanly, you might be scored at zero and become invisible. Use a clean, single-column layout with standard section titles. And always, always answer knockout questions truthfully—they are the only thing that can truly auto-reject you."
        - link "Get a résumé parse report for your target roles →" [ref=f3e107] [cursor=pointer]:
          - /url: https://vectormatch.dev
        - paragraph [ref=f3e108]:
          - text: Referrals also bypass much of the ranking system. If an employee refers you, your application is often flagged and moved to the top of the recruiter’s queue.
          - link "Networking isn’t just about getting a job; it’s about skipping the queue entirely" [ref=f3e109] [cursor=pointer]:
            - /url: https://vectormatch.dev
          - text: .
